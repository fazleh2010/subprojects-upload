<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Folder Upload</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .file-input-label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .file-input-label:hover {
            background-color: #45a049;
        }

        #fileList {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background-color: #fafafa;
        }

        button {
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>

    <h1>Upload a Folder</h1>

    <form method="POST" enctype="multipart/form-data" action="/upload_folder">
        <label for="folderInput" class="file-input-label">Select Folder</label>
        <input type="file" id="folderInput" name="files[]" webkitdirectory directory multiple style="display: none;" required>

        <div id="fileList">No folder selected</div>

        <button type="submit">Upload Folder</button>
    </form>

    <script>
        const folderInput = document.getElementById('folderInput');
        const fileListDisplay = document.getElementById('fileList');

        folderInput.addEventListener('change', function () {
            if (folderInput.files.length > 0) {
                let fileListHTML = '<strong>Files to Upload:</strong><ul>';
                Array.from(folderInput.files).forEach(file => {
                    fileListHTML += `<li>${file.webkitRelativePath}</li>`;
                });
                fileListHTML += '</ul>';
                fileListDisplay.innerHTML = fileListHTML;
            } else {
                fileListDisplay.innerHTML = 'No folder selected';
            }
        });
    </script>

</body>
</html>

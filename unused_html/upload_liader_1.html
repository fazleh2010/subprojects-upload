<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Folder Upload with Auto-Completion and Dropdowns</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 40px;
            width: 400px;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .file-input-label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .file-input-label:hover {
            background-color: #45a049;
        }

        #fileList {
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background-color: #fafafa;
        }

        button {
            background-color: #2196F3;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>

    <h1>Upload your data</h1>

    <form method="POST" enctype="multipart/form-data" action="/upload_folder">

        <!-- Name as Select Box -->
        <select name="name" id="name" required>
            <option value="">Select your full name</option>
            {% for name in names %}
                <option value="{{ name }}">{{ name }}</option>
            {% endfor %}
            <option value="other">Other (Enter your full name)</option>
        </select>

        <!-- New Name Input -->
        <input type="text" name="new_name" id="newName" placeholder="Enter your full name" style="display:none;">

        <!-- Email as Select Box -->
        <select name="email" id="email" required>
            <option value="">Select your email</option>
            {% for email in emails %}
                <option value="{{ email }}">{{ email }}</option>
            {% endfor %}
            <option value="other">Other (Enter New Email)</option>
        </select>

        <!-- New Email Input -->
        <input type="email" name="new_email" id="newEmail" placeholder="Enter new email" style="display:none;">

        <!-- Institution as Select Box -->
        <select name="institution" id="institution" required>
            <option value="">Select your institution</option>
            {% for institution in institutions %}
                <option value="{{ institution }}">{{ institution }}</option>
            {% endfor %}
            <option value="other">Other (Enter New Institution)</option>
        </select>

        <!-- New Institution Input -->
        <input type="text" name="new_institution" id="newInstitution" placeholder="Enter new institution" style="display:none;">

        <!-- Folder Upload -->
        <label for="folderInput" class="file-input-label">Select Folder</label>
        <input type="file" id="folderInput" name="files[]" webkitdirectory directory multiple style="display: none;" required>

        <div id="fileList">No folder selected</div>

        <button type="submit">Upload Folder</button>
    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <script>
        const folderInput = document.getElementById('folderInput');
        const fileListDisplay = document.getElementById('fileList');

        const nameSelect = document.getElementById('name');
        const newNameInput = document.getElementById('newName');

        const emailSelect = document.getElementById('email');
        const newEmailInput = document.getElementById('newEmail');

        const institutionSelect = document.getElementById('institution');
        const newInstitutionInput = document.getElementById('newInstitution');

        folderInput.addEventListener('change', function () {
            if (folderInput.files.length > 0) {
                let fileListHTML = '<strong>Files to Upload:</strong><ul>';
                Array.from(folderInput.files).forEach(file => {
                    fileListHTML += `<li>${file.webkitRelativePath}</li>`;
                });
                fileListHTML += '</ul>';
                fileListDisplay.innerHTML = fileListHTML;
            } else {
                fileListDisplay.innerHTML = 'No folder selected';
            }
        });

        nameSelect.addEventListener('change', function () {
            if (nameSelect.value === 'other') {
                newNameInput.style.display = 'block';
                newNameInput.required = true;
            } else {
                newNameInput.style.display = 'none';
                newNameInput.required = false;
            }
        });

        emailSelect.addEventListener('change', function () {
            if (emailSelect.value === 'other') {
                newEmailInput.style.display = 'block';
                newEmailInput.required = true;
            } else {
                newEmailInput.style.display = 'none';
                newEmailInput.required = false;
            }
        });

        institutionSelect.addEventListener('change', function () {
            if (institutionSelect.value === 'other') {
                newInstitutionInput.style.display = 'block';
                newInstitutionInput.required = true;
            } else {
                newInstitutionInput.style.display = 'none';
                newInstitutionInput.required = false;
            }
        });
    </script>

</body>
</html>
